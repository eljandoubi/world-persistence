[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "worldpersist"
version = "0.1.0"
description = "Occlusion benchmark for action-conditioned next-frame predictors"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy", "torch"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
frugal = ["onnx", "onnxruntime"]
plots = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
